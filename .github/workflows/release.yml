name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes-current.md"
          printf '## Changelog\n\n' > "$notes"
          awk -v version="$version" '
            $0 ~ "^### +v?" version "$" { in_section = 1; next }
            in_section && /^### / { exit }
            in_section { print }
          ' .releasenotes >> "$notes"
          grep -q '^- ' "$notes"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes-current.md
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
