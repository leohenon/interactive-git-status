version: 2

project_name: igs

builds:
  - id: igs
    main: ./cmd/igs
    binary: igs
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: igs
    ids:
      - igs
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

brews:
  - name: igs
    ids:
      - igs
    repository:
      owner: leohenon
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/leohenon/interactive-git-status
    description: Minimal interactive git status
    license: MIT
    install: |
      bin.install "igs"
    test: |
      system "#{bin}/igs", "--help"
